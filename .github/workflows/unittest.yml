name: Helm Unit Test

on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  find_changed_charts:
    name: Find Changed Charts
    runs-on: ubuntu-latest
    outputs:
      chart_paths: ${{ steps.set-paths.outputs.charts }}

    steps:
      - name: Checkout files in the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changed-files diffs a push against the event's "before" commit,
          # which the default depth of 1 does not contain. Full history keeps a
          # push of any length correct; the repository is small enough that
          # cloning all of it costs nothing.
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            charts/**

      - name: Find changed chart directories
        id: set-paths
        run: |
          # Extract unique chart directories from changed files
          CHARTS=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep '^charts/' | awk -F'/' '{print $2}' | sort | uniq)
          echo "Changed charts: $CHARTS"
          # Convert to JSON array
          CHARTS_JSON=$(echo "$CHARTS" | jq -R -s -c 'split("\n")[:-1]')
          echo "charts=$CHARTS_JSON" >> $GITHUB_OUTPUT

  unittest:
    name: Helm Unit Test
    runs-on: ubuntu-latest
    needs: find_changed_charts
    strategy:
      matrix:
        chart: ${{ fromJson(needs.find_changed_charts.outputs.chart_paths) }}

    steps:
      - name: Checkout files in the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install helm-unittest
        # Helm 4 verifies plugin sources by default, and a git source cannot be
        # verified; the version is pinned instead.
        run: helm plugin install --verify=false --version v1.1.2 https://github.com/helm-unittest/helm-unittest

      - name: Run unit tests for ${{ matrix.chart }}
        run: |
          helm dependency update charts/${{ matrix.chart }}
          helm unittest charts/${{ matrix.chart }}
