suite: test podmonitor
templates:
  - templates/podmonitor.yaml
tests:
  - it: should be disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not be created if disabled
    set:
      podMonitor:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should pass various assertions
    set:
      podMonitor:
        enabled: true
        labels:
          prometheus: main
        podMetricsEndpoints:
          - port: metrics
            interval: 15m
          - port: web
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - isKind:
          of: PodMonitor
      - equal:
          path: metadata.name
          value: RELEASE-NAME-app-metrics
      - isSubset:
          path: metadata.labels
          content:
            prometheus: main
            app.kubernetes.io/name: app
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: app
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: metrics
      - equal:
          path: spec.podMetricsEndpoints[0].interval
          value: 15m
      - equal:
          path: spec.podMetricsEndpoints[1].port
          value: web
