suite: test headless service
templates:
  - templates/service-headless.yaml
tests:
  - it: should not render for a Deployment
    set:
      app:
        kind: Deployment
        statefulSet:
          headless:
            enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for a StatefulSet when disabled
    set:
      app:
        kind: StatefulSet
    asserts:
      - hasDocuments:
          count: 0

  - it: should render for a StatefulSet when enabled
    set:
      app:
        kind: StatefulSet
        statefulSet:
          headless:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-app-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: app
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.ports[0]
          value:
            port: 80
            targetPort: 80
            protocol: TCP
            name: http

  - it: should carry the common labels and every declared port
    set:
      app:
        kind: StatefulSet
        statefulSet:
          headless:
            enabled: true
      service:
        ports:
          - port: 80
            containerPort: 8080
            name: http
          - port: 9090
            name: peer
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: app
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
      - lengthEqual:
          path: spec.ports
          count: 2
      - equal:
          path: spec.ports[1]
          value:
            port: 9090
            targetPort: 9090
            protocol: TCP
            name: peer
