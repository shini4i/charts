suite: test middleware
templates:
  - templates/middleware.yaml
tests:
  - it: should be disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not be created when middleware is disabled
    set:
      middleware:
        enabled: false
        sourceRange:
          - 10.10.10.1/24
    asserts:
      - hasDocuments:
          count: 0

  - it: should not be created without a source range
    set:
      middleware:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should pass various assertions
    set:
      middleware:
        enabled: true
        labels:
          traffic-type: private
        sourceRange:
          - 0.0.0.0/0
          - 10.10.10.1/24
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: traefik.io/v1alpha1
      - isKind:
          of: Middleware
      - equal:
          path: metadata.name
          value: RELEASE-NAME-app-whitelist
      - equal:
          path: spec.ipAllowList.sourceRange[0]
          value: 0.0.0.0/0
      - equal:
          path: spec.ipAllowList.sourceRange[1]
          value: 10.10.10.1/24
      - isSubset:
          path: metadata.labels
          content:
            traffic-type: private
            app.kubernetes.io/name: app
            app.kubernetes.io/managed-by: Helm

  - it: should use ipWhiteList on the traefik v2 api group
    set:
      traefik:
        apiVersion: traefik.containo.us/v1alpha1
      middleware:
        enabled: true
        sourceRange:
          - 10.10.10.1/24
    asserts:
      - isAPIVersion:
          of: traefik.containo.us/v1alpha1
      - equal:
          path: spec.ipWhiteList.sourceRange[0]
          value: 10.10.10.1/24
      - notExists:
          path: spec.ipAllowList
