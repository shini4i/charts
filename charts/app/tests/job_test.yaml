suite: test job
templates:
  - templates/job.yaml
tests:
  - it: should be disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not be created if disabled
    set:
      job:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should pass environment variable assertions
    set:
      job:
        enabled: true
        env:
          - name: example
            value: example1
        envFrom:
          - configMapRef:
              name: example-configmap
          - secretRef:
              name: example-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: example
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: example1
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value:
            configMapRef:
              name: example-configmap
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            secretRef:
              name: example-secret

  - it: should pass various assertions
    set:
      job:
        enabled: true
        annotations:
          example: example1
        image:
          repository: alpine
          tag: 3.19
        command: ["sh", "-c", "echo test"]
        restartPolicy: Always
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: batch/v1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations
          value:
            example: example1
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine:3.19
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - sh
            - -c
            - echo test
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: should set nodeSelector, tolerations and affinity
    set:
      job:
        enabled: true
        nodeSelector:
          example: example1
        tolerations:
          - key: example
            operator: Equal
            value: example1
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: example
                      operator: In
                      values:
                        - example1
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            example: example1
      - equal:
          path: spec.template.spec.tolerations[0]
          value:
            key: example
            operator: Equal
            value: example1
            effect: NoSchedule
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: example
                        operator: In
                        values:
                          - example1

  - it: should set both securityContext and podSecurityContext
    set:
      job:
        enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
        podSecurityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000

  - it: should override ServiceAccount name
    set:
      job:
        enabled: true
        serviceAccountName: example-service-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: example-service-account

  - it: should not set annotations by default
    set:
      job:
        enabled: true
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should keep every annotation nested under metadata
    set:
      job:
        enabled: true
        annotations:
          "helm.sh/hook": pre-upgrade
          "helm.sh/hook-delete-policy": before-hook-creation
          example: example1
    asserts:
      - equal:
          path: metadata.annotations
          value:
            "helm.sh/hook": pre-upgrade
            "helm.sh/hook-delete-policy": before-hook-creation
            example: example1

  - it: should set chart labels and additional labels
    set:
      job:
        enabled: true
        labels:
          example: example1
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: app
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels.example
          value: example1

  - it: should set pod labels and pod annotations
    set:
      job:
        enabled: true
        podLabels:
          example: example1
        podAnnotations:
          example: example2
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: job
            example: example1
      - equal:
          path: spec.template.metadata.annotations
          value:
            example: example2

  - it: should not label job pods with the service selector pair
    set:
      job:
        enabled: true
    asserts:
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]

  - it: should ignore a name label supplied through podLabels
    set:
      job:
        enabled: true
        podLabels:
          "app.kubernetes.io/name": app
          example: example1
    asserts:
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: spec.template.metadata.labels.example
          value: example1

  - it: should render zero second timeouts
    set:
      job:
        enabled: true
        ttlSecondsAfterFinished: 0
        activeDeadlineSeconds: 0
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 0
      - equal:
          path: spec.activeDeadlineSeconds
          value: 0

  - it: should use safe job defaults
    set:
      job:
        enabled: true
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 1
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: should set args and resources
    set:
      job:
        enabled: true
        args: ["-c", "echo test"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - -c
            - echo test
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi

  - it: should not set args or resources by default
    set:
      job:
        enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: should set volumes and volumeMounts
    set:
      job:
        enabled: true
        volumes:
          - name: config
            configMap:
              name: example-configmap
        volumeMounts:
          - name: config
            mountPath: /etc/config
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: config
            configMap:
              name: example-configmap
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: config
            mountPath: /etc/config

  - it: should set ttlSecondsAfterFinished and activeDeadlineSeconds
    set:
      job:
        enabled: true
        ttlSecondsAfterFinished: 300
        activeDeadlineSeconds: 600
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600

  - it: should omit optional pod fields when unset
    set:
      job:
        enabled: true
    asserts:
      - notExists:
          path: spec.ttlSecondsAfterFinished
      - notExists:
          path: spec.activeDeadlineSeconds
      - notExists:
          path: spec.template.metadata.annotations
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.volumes
