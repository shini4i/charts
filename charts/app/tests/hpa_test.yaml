suite: test hpa
templates:
  - templates/hpa.yaml
tests:
  - it: should be disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not be created if disabled
    set:
      autoscaling:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should pass default values when enabled
    set:
      autoscaling:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: RELEASE-NAME-app
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 100
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 80
      - equal:
          path: spec.metrics[0].resource.target.type
          value: Utilization
      - notExists:
          path: spec.behavior

  - it: should target a statefulset when app kind is StatefulSet
    set:
      app:
        kind: StatefulSet
      autoscaling:
        enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet

  - it: should pass custom replica size
    set:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 10
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10

  - it: should pass custom cpu target utilization
    set:
      autoscaling:
        enabled: true
        targetCPUUtilizationPercentage: 65
    asserts:
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 65

  - it: should pass custom memory target and default cpu target utilization
    set:
      autoscaling:
        enabled: true
        targetMemoryUtilizationPercentage: 50
    asserts:
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 80
      - equal:
          path: spec.metrics[1].resource.target.averageUtilization
          value: 50

  - it: should pass scaling behavior
    set:
      autoscaling:
        enabled: true
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 600
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 600
