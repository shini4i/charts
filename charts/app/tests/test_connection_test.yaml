suite: test connection hook
templates:
  - templates/tests/test-connection.yaml
tests:
  - it: should target the first service port
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-app-test-connection
      - equal:
          path: spec.containers[0].args
          value:
            - RELEASE-NAME-app:80

  - it: should follow a custom first service port
    set:
      service:
        ports:
          - port: 8080
            containerPort: 8080
            name: http
    asserts:
      - equal:
          path: spec.containers[0].args
          value:
            - RELEASE-NAME-app:8080

  - it: should stay a helm test hook
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: test

  - it: should not match the service selector
    asserts:
      - notExists:
          path: metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: test
