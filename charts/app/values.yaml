replicaCount: 1

image:
  repository: traefik/whoami
  pullPolicy: IfNotPresent
  # -- Image tag. Leave empty to pin the image by digest through image.repository
  tag: "v1.10.2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Whether pods using this service account get an API token mounted. Left unset
  # to keep the Kubernetes default (true); set to false for workloads that never
  # call the API server
  automountServiceAccountToken: null

podAnnotations: {}

# -- Number of superseded ReplicaSets or ControllerRevisions kept for rollbacks
revisionHistoryLimit: 3

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  # -- Annotations to add to the service
  annotations: {}
  # -- Service sessionAffinity, e.g. ClientIP. Unset means None
  sessionAffinity: ""
  # -- Service ports. containerPort defaults to port, protocol to TCP;
  # appProtocol and nodePort are optional
  ports:
    - port: 80
      containerPort: 80
      name: http

# -- Classical ingress definition
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Port to use with ingress
  exposedPort: 80
  hosts: []
  #  - host: chart-example.local
  #    paths:
  #      - path: /
  #        pathType: ImplementationSpecific
  #      - path: /oauth2
  #        pathType: ImplementationSpecific
  #        backend:
  #          serviceName: oauth2-proxy
  #          servicePort: 8080
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

traefik:
  # -- CRD API group used by the ingressRoute and middleware templates. Traefik v3
  # serves traefik.io/v1alpha1; set traefik.containo.us/v1alpha1 for Traefik v2
  apiVersion: traefik.io/v1alpha1

# -- Traefik ingressRoute definition
ingressRoute:
  enabled: false
  entryPoint: websecure
  host: example.com
  tls:
    # -- Terminate TLS on the route. Turn off for a plain HTTP entryPoint
    enabled: true
  # -- TLS secret for the route. Empty falls back to the entryPoint certificate
  tlsSecret: example-com-tls
  # -- Port to use with ingressRoute
  exposedPort: 80
  annotations: {}
  labels: {}

# -- Whitelist Middleware definition
middleware:
  enabled: false
  labels: {}
  # -- CIDRs allowed to reach the route. A Middleware is created only when this
  # is non-empty and middleware.enabled is true
  sourceRange: []
  # -- Names of existing middlewares, attached after the whitelist. Needs enabled: true
  existingMiddlewares: []
  #  - oauth2-proxy

app:
  # -- Allowed values: Deployment or StatefulSet
  kind: Deployment

  # -- StatefulSet configuration (only used if kind is set to StatefulSet)
  statefulSet:
    strategy: RollingUpdate
    podManagementPolicy: OrderedReady
    headless:
      # -- Create a headless service and point spec.serviceName at it, which is what
      # stable per-pod DNS requires. Off by default because spec.serviceName is
      # immutable: on an existing release the StatefulSet has to be recreated
      enabled: false
    persistence:
      enabled: false
      # -- Persistent volumes configuration. accessModes defaults to
      # ["ReadWriteOnce"]; size is required
      volumes: []
      #  - name: data
      #    mountPath: /data
      #    size: 1Gi
      #    storageClassName: ""
      #    accessModes:
      #     - ReadWriteOnce

  # -- Deployment configuration (only used if kind is set to Deployment)
  deployment:
    strategy: RollingUpdate
    # Used only if strategy is set to RollingUpdate
    maxUnavailable: 25%
    maxSurge: 1
    # -- Seconds a rollout may stall before it is marked failed
    progressDeadlineSeconds: null

  # -- A primary container command override
  command: []
    # - /bin/sh

  # -- A primary container args
  args: []
    # - -c
    # - echo "Hello, World!"

  # -- Labels to add to the app pods on top of the common chart labels. The
  # selector labels cannot be overridden
  podLabels: {}

  # -- Seconds a new pod must stay ready before it counts as available
  minReadySeconds: null

  # -- Grace period for a terminating pod. Should exceed the time the app needs
  # to drain in-flight requests
  terminationGracePeriodSeconds: null

  # -- PriorityClass for the app pods
  priorityClassName: ""

  # -- Whether the app pods get an API token mounted. Left unset to keep the
  # Kubernetes default
  automountServiceAccountToken: null

  # -- Raw yaml definition of topology spread constraints
  topologySpreadConstraints: []
  #  - maxSkew: 1
  #    topologyKey: topology.kubernetes.io/zone
  #    whenUnsatisfiable: ScheduleAnyway
  #    labelSelector: { matchLabels: { app.kubernetes.io/name: app } }

  sharedVolume:
    # -- Mount an emptyDir at /shared in the primary container
    enabled: true

  # -- Startup probe configuration
  startupProbe: {}
  #  httpGet:
  #    path: /
  #    port: http

  # -- Liveness probe configuration
  livenessProbe: {}
  #  httpGet:
  #    path: /
  #    port: http

  # -- Readiness probe configuration. A rolling update has no gate without one
  readinessProbe: {}
  #  httpGet:
  #    path: /
  #    port: http

  # -- Environment variables to pass to main app container
  env: []
  # - name: "ENV_NAME"
  #   value: "test"

  # -- envFrom to pass to main app container
  envFrom: []
  # - configMapRef:
  #     name: config-map-name
  # - secretRef:
  #     name: secret-name

  # -- raw yaml definition of additional volume mounts (requires matching volume definition)
  additionalVolumeMounts: []
  #  - name: nginx-config
  #    mountPath: /etc/nginx
  #    subPath: nginx.conf

  lifecycle: {}
  #  postStart:
  #    exec:
  #      command: ["cp -R /www/default /shared/public"]

# -- Raw yaml definition of sidecar containers
sideCars: []
#  - name: sidecar
#    image: "image:tag"
#    imagePullPolicy: IfNotPresent

# -- Raw yaml definition of additional volumes
volumes: []
  # - name: nginx-config
  #   configMap:
  #    name: nginx-config

# -- Raw yaml definition of init containers
initContainers: []
  # - name: test
  #   image: alpine:3.14.2
  #   command: ["sh", "-c", "echo test"]

# -- PodDisruptionBudget. Set exactly one of minAvailable or maxUnavailable
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: null
  # -- AlwaysAllow lets a drain evict already-unhealthy pods. Needs Kubernetes 1.27
  unhealthyPodEvictionPolicy: null
  annotations: {}

job:
  enabled: false
  image:
    repository: curlimages/curl
    tag: 8.7.1
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # -- A job container command override
  command: ["curl", "https://ifconfig.me"]
  # -- A job container args
  args: []
  restartPolicy: Never
  backoffLimit: 1
  # -- Seconds to keep a finished job before the TTL controller removes it
  ttlSecondsAfterFinished: null
  # -- Seconds a job may run before it is terminated and marked failed
  activeDeadlineSeconds: null
  # -- Annotations to add to the job. Set "helm.sh/hook" here to run the job as a Helm hook
  annotations: {}
  #  "helm.sh/hook": pre-upgrade
  #  "helm.sh/hook-delete-policy": before-hook-creation
  # -- Labels to add to the job on top of the common chart labels
  labels: {}
  # -- Annotations to add to the job pod
  podAnnotations: {}
  # -- Labels to add to the job pod on top of instance, managed-by and component. app.kubernetes.io/name is ignored: it would enrol job pods as Service endpoints
  podLabels: {}
  # -- An override for the job service account
  serviceAccountName: ""
  # -- NodeSelector to use for the job pod
  nodeSelector: {}
  # -- Tolerations to use for the job pod
  tolerations: []
  # -- Affinity to use for the job pod
  affinity: {}
  # -- securityContext to use for the job container
  securityContext: {}
  #  allowPrivilegeEscalation: false
  #  capabilities:
  #    drop: [ "ALL" ]
  # -- podSecurityContext to use for the job pod
  podSecurityContext: {}
  #  runAsUser: 1000
  #  runAsGroup: 1000
  #  fsGroup: 1000
  # -- Resources to request for the job container
  resources: {}
  #  requests:
  #    cpu: 100m
  #    memory: 128Mi
  # -- Environment variables to pass to job container
  env: []
  # - name: "ENV_NAME"
  #   value: "test"
  # -- envFrom to pass to job container
  envFrom: []
  # - configMapRef:
  #     name: config-map-name
  # - secretRef:
  #     name: secret-name
  # -- Raw yaml definition of volumes available to the job pod
  volumes: []
  #  - name: config
  #    configMap:
  #      name: config-map-name
  # -- Raw yaml definition of volume mounts for the job container
  volumeMounts: []
  #  - name: config
  #    mountPath: /etc/config

podMonitor:
  enabled: false
  # -- Endpoints to scrape. At least one is required when podMonitor is enabled
  podMetricsEndpoints: []
  #  - port: metrics
  #  - port: web
  labels: {}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  # -- Raw yaml definition of the HPA scaling behavior
  behavior: {}
  #  scaleDown:
  #    stabilizationWindowSeconds: 600

keda:
  enabled: false
  minReplicaCount: 2
  maxReplicaCount: 5
  # -- Seconds between trigger evaluations
  pollingInterval: 30
  # -- Seconds to wait after the last trigger fired before scaling down
  cooldownPeriod: 300
  # -- At least one trigger is required when keda is enabled
  triggers: []
    # - metadata:
    #    metricName: app_http_request_count
    #    query: sum(increase(app_http_request_count{path="/important-endpoint"}[2m]))
    #    serverAddress: http://prometheus.monitoring:9090
    #    threshold: '80'
    #    type: prometheus
  fallback: {}
   # failureThreshold: 3
   # replicas: 4
  advanced: {}
   # restoreToOriginalReplicaCount: false
   # horizontalPodAutoscalerConfig:
   #   behavior:
   #     scaleDown:
   #       stabilizationWindowSeconds: 600
   #       policies:
   #         - type: Percent
   #           value: 10
   #           periodSeconds: 15


nodeSelector: {}

tolerations: []

affinity: {}

