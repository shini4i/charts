{{- if and .Values.middleware.enabled .Values.middleware.sourceRange -}}
apiVersion: {{ .Values.traefik.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "app.suffixedName" (dict "context" . "suffix" "whitelist") }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.middleware.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /* Traefik renamed the field in v3; the v2 CRD is structural and silently
         prunes the name it does not know, taking the restriction with it. */}}
  {{- if hasPrefix "traefik.containo.us/" .Values.traefik.apiVersion }}
  ipWhiteList:
  {{- else }}
  ipAllowList:
  {{- end }}
    sourceRange:
      {{- toYaml .Values.middleware.sourceRange | nindent 6 }}
{{- end }}
