replicaCount: 1

revisionHistory: 1

image:
  repository: ghcr.io/shini4i/argo-watcher
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Liveness probe configuration
livenessProbe:
  enabled: true
  path: /healthz
  periodSeconds: 30
  timeoutSeconds: 5
  initialDelaySeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  enabled: true
  path: /healthz
  periodSeconds: 10
  timeoutSeconds: 3
  initialDelaySeconds: 3
  failureThreshold: 3

# -- Startup probe configuration
startupProbe:
  enabled: false
  path: /healthz
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

logLevel: info

argo:
  url: https://argocd.example.com
  # -- An alias that will be used to generate url for ArgoCD app
  urlAlias: ""
  # -- If ssl verification should be skipped
  skipTlsVerify: false
  # -- How long to wait for deployment to be finished
  timeout: 300
  # -- How long to wait for argocd api to respond
  apiTimeout: 60
  # -- argo-watcher will assume that image can be mutated and will use this value while checking app status
  registryProxyUrl: ""
  # -- If argo-watcher should refresh app during check to make ArgoCD detect changes faster
  refreshApp: true
  # -- Pre-created secret with ARGO_TOKEN variable and optional ARGO_WATCHER_DEPLOY_TOKEN
  secretName: ""

# -- Configuration for argo image updater logic replacement (optional)
updater:
  # -- Pre-created secret with ssh key
  sshSecretName: ""
  # -- Key to mount from sshSecretName
  sshKey: "sshPrivateKey"
  # -- Extra known hosts to add to ssh config, will be skipped if knownHostsConfigMap is set (optional)
  extraKnownHosts: []
    # - bitbucket.org ssh-rsa 
  # -- Known hosts configmap override (optional)
  knownHostsConfigMap: ""
  # -- Known hosts configmap key (optional)
  knownHostsKey: "ssh_known_hosts"
  # -- User to use for git operations
  commitAuthor: "argo-watcher"
  # -- Email to use for git operations
  commitEmail: "argo-watcher@example.com"

# -- Schedule lockdown configuration
scheduledLockdown: []
#  - "Fri 20:00 - Mon 08:00"
#  - "Tue 22:00 - Tue 23:15"

# -- OIDC / SSO authentication configuration. Requires argo-watcher >= v0.13.0;
# earlier versions only honor the deprecated KEYCLOAK_* variables, which can be
# set via extraEnvs.
oidc:
  # -- Enables OIDC authentication for the Web UI and privileged operations
  enabled: false
  # -- Identity provider issuer URL used for OIDC discovery, e.g.
  # https://keycloak.example.com/realms/example (required when enabled)
  issuerUrl: ""
  # -- Client ID registered with the identity provider (required when enabled)
  clientId: ""
  # -- Interval in milliseconds between token validations
  tokenValidationInterval: 10000
  # -- Groups whose members may redeploy applications and manage the deployment lock
  privilegedGroups: []
  #  - platform-team
  #  - sre-team

# -- Additional environment variables to add to the container (supports both value and valueFrom)
extraEnvs: []
#  - name: EXTRA_ENV
#    value: "extra-value"
#  - name: SECRET_ENV
#    valueFrom:
#      secretKeyRef:
#        name: my-secret
#        key: secret-key

postgres:
  # -- Sets STATE_TYPE to postgres
  enabled: false
  host: ""
  port: 5432
  name: ""
  user: ""
  # -- Pre-created secret with DB_PASSWORD variable
  secretName: ""
  # -- Support for an optional key override (this specific key would be exposed to DB_PASSWORD)
  secretKey: ""

migration:
  restartPolicy: OnFailure
  backoffLimit: 5

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true

  resources: {}

  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Whether to automount the service account token
  automountServiceAccountToken: true

podMonitor:
  enabled: false
  # interval: 30s
  # scrapeTimeout: 5s
  labels: {}

podAnnotations: {}

# -- Duration in seconds the pod needs to terminate gracefully
# terminationGracePeriodSeconds: 30

podSecurityContext:
  fsGroup: 65532

securityContext:
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

networkPolicies:
  # -- If network policies should be created
  enabled: false
  # -- additional ingress rules to add to the network policy (access will be granted to .Values.service.containerPort)
  additionalRules: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: "ingress-nginx"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

persistence:
  # -- Enable persistence using a Persistent Volume Claim
  enabled: true
  # -- Annotations to add to the persistent volume claim
  annotations: {}
  # -- The storage class to use for the persistent volume claim.
  # If undefined or null, the default storage class will be used.
  # storageClassName: ""
  # -- The access modes for the persistent volume claim
  accessModes:
    - ReadWriteOnce
  # -- The size of the persistent volume claim
  size: 1Gi
  # -- Size limit for emptyDir volume used when persistence is disabled (tmpfs)
  emptyDirSizeLimit: "256Mi"
  # -- The path to mount the persistent volume in the container
  mountPath: "/data"

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# -- PodDisruptionBudget configuration
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# Optional argo-watcher-mcp deployment (https://github.com/shini4i/argo-watcher-mcp),
# which exposes argo-watcher's read-only API as MCP tools for AI agents. It runs as
# its own workload, not as a sidecar, so it can be updated and exposed without
# restarting argo-watcher.
#
# The MCP endpoint performs NO authentication or authorization of its own. Read
# "Exposing the MCP server" in the chart README before exposing it.
mcp:
  # -- Deploy the MCP server alongside argo-watcher
  enabled: false
  replicaCount: 1
  revisionHistory: 1

  image:
    repository: ghcr.io/shini4i/argo-watcher-mcp
    pullPolicy: IfNotPresent
    # -- MCP server image tag. Pinned here rather than derived from the chart
    # appVersion, which tracks argo-watcher itself. Required when mcp is enabled.
    tag: "v0.3.0"

  # -- How long the MCP server waits for an argo-watcher API response
  requestTimeout: 15s

  # -- Liveness probe configuration. /healthz reports only whether the MCP
  # process is up; it does not depend on argo-watcher.
  livenessProbe:
    enabled: true
    path: /healthz
    periodSeconds: 30
    timeoutSeconds: 5
    initialDelaySeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration. Defaults to /healthz so the server keeps
  # serving while argo-watcher is down, which is what lets its get_reachability
  # tool report the outage. Set path to /readyz to gate readiness on argo-watcher
  # being reachable instead, accepting that the endpoint disappears with it.
  readinessProbe:
    enabled: true
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 3
    initialDelaySeconds: 3
    failureThreshold: 3

  # -- Additional environment variables for the MCP container, e.g. the OTEL_*
  # settings (supports both value and valueFrom)
  extraEnvs: []
  #  - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #    value: "otel-collector.observability:4317"

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use. Required when create is false.
    name: ""
    # -- Whether to automount the service account token. The MCP server never
    # calls the Kubernetes API.
    automountServiceAccountToken: false

  service:
    type: ClusterIP
    port: 80
    containerPort: 8000

  # Ingress for the MCP endpoint. WARNING: argo-watcher-mcp performs no
  # authentication or authorization; anything that can reach this Ingress can
  # read the full deployment history and instance configuration. Only enable it
  # with an authenticating proxy in front — see the chart README.
  ingress:
    # -- Expose the MCP endpoint via Ingress. The endpoint is UNAUTHENTICATED;
    # put an authenticating proxy in front of it.
    enabled: false
    className: ""
    annotations: {}
      # nginx.ingress.kubernetes.io/auth-url: "https://oauth2-proxy.example.com/oauth2/auth"
      # nginx.ingress.kubernetes.io/auth-signin: "https://oauth2-proxy.example.com/oauth2/start?rd=$escaped_request_uri"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  networkPolicies:
    # -- Additional ingress rules granting access to the MCP container port.
    # Created when networkPolicies.enabled is true; kept separate from
    # networkPolicies.additionalRules so opening the MCP endpoint to a wider
    # audience cannot also open the argo-watcher API.
    additionalRules: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: "ingress-nginx"

  podMonitor:
    enabled: false
    # interval: 30s
    # scrapeTimeout: 5s
    labels: {}

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false

  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

  topologySpreadConstraints: []
