apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "argo-watcher.fullname" . }}-test-connection"
  {{- /* Not argo-watcher.labels: the selector pair in it would enrol this pod as
         a Service endpoint and route live traffic to it while the test runs. */}}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command: ['wget']
      args: ['{{ include "argo-watcher.fullname" . }}:{{ .Values.service.port }}']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
