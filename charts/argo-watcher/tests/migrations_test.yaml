suite: test migrations
templates:
  - templates/migrations.yaml
tests:
  - it: should be disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should generate a valid migration Job
    set:
      image:
        repository: ghcr.io/shini4i/argo-watcher
        tag: demo
      postgres:
        enabled: true
        host: db-host
        port: 5432
        name: mydb
        user: myuser
        secretName: db-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations
          value:
            "helm.sh/hook": pre-install,pre-upgrade
            "helm.sh/hook-weight": "0"
            "helm.sh/hook-delete-policy": before-hook-creation
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/shini4i/argo-watcher:demo
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /usr/local/bin/argo-watcher
            - --migrate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: db-host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PORT
            value: "5432"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_NAME
            value: mydb
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: myuser
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: db-secret
      - equal:
          path: spec.backoffLimit
          value: 5
      - equal:
          path: spec.template.spec.restartPolicy
          value: OnFailure
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-argo-watcher-migration

  - it: should expose DB_PASSWORD from a specific key in a specific secret
    set:
      postgres:
        enabled: true
        secretName: auto-generated-secret
        secretKey: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: auto-generated-secret

  - it: should not use envFrom when secretKey is provided
    set:
      postgres:
        enabled: true
        secretName: auto-generated-secret
        secretKey: password
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: should apply pod and container security contexts
    set:
      postgres:
        enabled: true
        secretName: db-secret
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000

  - it: should use imagePullSecrets when provided
    set:
      postgres:
        enabled: true
        secretName: db-secret
      imagePullSecrets:
        - name: regcred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: regcred

  - it: should not render DB_SSL_MODE when postgres.sslMode is unset
    set:
      postgres:
        enabled: true
        secretName: db-secret
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_SSL_MODE
          any: true

  - it: should render DB_SSL_MODE when postgres.sslMode is set
    set:
      postgres:
        enabled: true
        secretName: db-secret
        secretKey: password
        sslMode: verify-full
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_SSL_MODE
            value: verify-full

  - it: should render DB_SSL_MODE when postgres.sslMode is explicitly disable
    set:
      postgres:
        enabled: true
        secretName: db-secret
        sslMode: disable
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_SSL_MODE
            value: disable

  - it: should render no volumes by default
    set:
      postgres:
        enabled: true
        secretName: db-secret
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should render migration.extraVolumes and migration.extraVolumeMounts
    set:
      postgres:
        enabled: true
        secretName: db-secret
      migration:
        extraVolumes:
          - name: postgres-ca
            secret:
              secretName: postgres-ca
        extraVolumeMounts:
          - name: postgres-ca
            mountPath: /etc/postgres-ca
            readOnly: true
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: postgres-ca
              secret:
                secretName: postgres-ca
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true

  - it: should not mount the server's extraVolumes into the migration Job
    set:
      postgres:
        enabled: true
        secretName: db-secret
      extraVolumes:
        - name: server-only
          emptyDir: {}
      extraVolumeMounts:
        - name: server-only
          mountPath: /server-only
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should not render PGSSLROOTCERT when postgres.sslRootCert is unset
    set:
      postgres:
        enabled: true
        secretName: db-secret
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLROOTCERT
          any: true

  - it: should render PGSSLROOTCERT when postgres.sslRootCert is set
    set:
      postgres:
        enabled: true
        secretName: db-secret
        sslMode: verify-full
        sslRootCert: /etc/postgres-ca/ca.crt
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLROOTCERT
            value: /etc/postgres-ca/ca.crt
