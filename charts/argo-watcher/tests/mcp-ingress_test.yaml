suite: test mcp ingress
templates:
  - templates/mcp-ingress.yaml
tests:
  - it: should be disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not be created when mcp itself is disabled
    set:
      mcp:
        enabled: false
        ingress:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should route to the mcp service
    set:
      mcp:
        enabled: true
        ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/auth-url: https://oauth2-proxy.example.com/oauth2/auth
          hosts:
            - host: mcp.example.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - mcp.example.com
                - mcp-alt.example.com
              secretName: mcp-example-com-tls
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME-argo-watcher-mcp
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: metadata.annotations
          value:
            nginx.ingress.kubernetes.io/auth-url: https://oauth2-proxy.example.com/oauth2/auth
      - equal:
          path: spec.rules[0].host
          value: mcp.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-argo-watcher-mcp
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
      - equal:
          path: spec.tls[0].secretName
          value: mcp-example-com-tls
      - equal:
          path: spec.tls[0].hosts
          value:
            - mcp.example.com
            - mcp-alt.example.com

  - it: should render every host and path
    set:
      mcp:
        enabled: true
        ingress:
          enabled: true
          hosts:
            - host: mcp.example.com
              paths:
                - path: /
                  pathType: Prefix
                - path: /mcp
                  pathType: Exact
            - host: mcp-alt.example.com
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /mcp
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: Exact
      - equal:
          path: spec.rules[1].host
          value: mcp-alt.example.com
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.name
          value: RELEASE-NAME-argo-watcher-mcp
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.port.number
          value: 80

  - it: should follow the mcp service port
    set:
      mcp:
        enabled: true
        service:
          port: 8080
        ingress:
          enabled: true
          hosts:
            - host: mcp.example.com
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080

  - it: should default the path type
    set:
      mcp:
        enabled: true
        ingress:
          enabled: true
          hosts:
            - host: mcp.example.com
              paths:
                - path: /
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
